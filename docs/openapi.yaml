openapi: 3.1.0

info:
  title: Radar API
  version: 0.1.0
  description: |
    Kıyı Medya aday tarama ve denetim sistemi.

    Faz 1 (iskelet) kapsamı: `/health`, `/stats`, `/businesses`. Kalan uçlar
    (`/discovery/run`, `/businesses/{id}/audit`, `/audits/{id}`, `/outreach/{id}`,
    `/jobs/{id}`) sonraki fazlarda bu dosyaya eklenir — SPEC §7 ve §8.

    Bu API yalnızca oturum açmadan erişilebilen halka açık veriyi döndürür. Erişim,
    gösterim, kaydetme, profil ziyareti ve demografi verisi sistemde **yoktur** ve
    hiçbir şemada yer almaz (CLAUDE.md kural 7).

servers:
  - url: http://localhost:8000
    description: Yerel geliştirme

# Faz 1'de kimlik doğrulama yoktur: servis yalnızca yerel ağda çalışır ve SPEC §8
# Faz 1 kapsamı auth içermez. Boş dizi bunu "tanımlanmamış" değil "bilinçli olarak
# yok" diye beyan eder. Kimlik doğrulama Faz 6 (sertleştirme) konusudur.
security: []

tags:
  - name: system
    description: Servis sağlığı
  - name: dashboard
    description: Panel verileri
  - name: discovery
    description: Keşif taraması
  - name: jobs
    description: Kuyruk işleri
  - name: audits
    description: Derin denetim

paths:
  /health:
    get:
      tags: [system]
      summary: Servis sağlığı
      description: |
        Postgres ve Redis bağlantılarını gerçekten yoklar. Bağımlılıklardan biri
        erişilemezse 503 döner ve ilgili alan `ok` olmaz.
      operationId: getHealth
      responses:
        '200':
          description: Tüm bağımlılıklar sağlıklı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: En az bir bağımlılık erişilemez durumda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /stats:
    get:
      tags: [dashboard]
      summary: Panel üst şeridi
      operationId: getStats
      responses:
        '200':
          description: Toplam sayaçlar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'

  /businesses:
    get:
      tags: [dashboard]
      summary: Aday listesi
      description: |
        Sayfalanmış işletme listesi. Her kayıt en son triyaj skorunu ve durumunu taşır;
        henüz taranmamış işletmelerde `score` ve `status` `null` olur.
      operationId: listBusinesses
      parameters:
        - name: status
          in: query
          required: false
          description: Triyaj durumuna göre filtre. Verilmezse tüm durumlar döner.
          schema:
            $ref: '#/components/schemas/TriageStatus'
        - name: category
          in: query
          required: false
          description: İşletme kategorisine göre birebir filtre.
          schema:
            type: string
            minLength: 1
        - name: min_score
          in: query
          required: false
          description: Bu değerin altındaki triyaj skoruna sahip kayıtlar elenir. Skoru olmayan kayıtlar da elenir.
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 100
        - name: limit
          in: query
          required: false
          description: Sayfa başına kayıt sayısı.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Atlanacak kayıt sayısı.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Filtreye uyan işletmeler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessList'
        '422':
          description: Geçersiz sorgu parametresi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /discovery/run:
    post:
      tags: [discovery]
      summary: Keşif taraması başlat
      description: |
        Bir bölge ve sorgu için Google Places keşfini kuyruğa alır. Senkron scraping
        yoktur (SPEC §7): uç anında bir `job_id` döner, ilerleme `GET /jobs/{id}` ile
        yoklanır. Yalnızca oturum açmadan erişilebilen halka açık veri toplanır.
      operationId: runDiscovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryRequest'
      responses:
        '202':
          description: İş kuyruğa alındı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '422':
          description: Geçersiz istek gövdesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /jobs/{id}:
    get:
      tags: [jobs]
      summary: Kuyruk işinin durumu
      description: |
        Kuyruğa alınmış bir işin durumunu döndürür. Arayüz bu ucu yoklayarak keşif/
        scraping ilerlemesini izler (FE-4).
      operationId: getJob
      parameters:
        - name: id
          in: path
          required: true
          description: "`POST /discovery/run` ucunun döndürdüğü iş kimliği."
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: İşin güncel durumu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404':
          description: Böyle bir iş yok (bilinmeyen veya süresi dolmuş `job_id`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /businesses/{id}/audit:
    post:
      tags: [audits]
      summary: Derin denetimi kuyruğa al
      description: |
        Nitelikli bir işletme için derin denetimi kuyruğa alır (SPEC §1). Senkron
        değil (SPEC §7): uç anında bir `job_id` döner, ilerleme `GET /jobs/{id}` ile
        yoklanır — `/discovery/run` ile aynı iş deseni.

        Yalnızca son triyaj durumu `qualified` olan hesap derin denetime girer
        (SPEC §1). Nitelikli olmayan hesap `409` döner; hiç taranmamış/skorsuz hesap
        da nitelikli sayılmaz.
      operationId: runAudit
      parameters:
        - name: id
          in: path
          required: true
          description: Denetlenecek işletmenin kimliği.
          schema:
            type: integer
            format: int64
      responses:
        '202':
          description: Denetim işi kuyruğa alındı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '404':
          description: Böyle bir işletme yok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '409':
          description: İşletme derin denetime uygun değil (durumu `qualified` değil)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /audits/{id}:
    get:
      tags: [audits]
      summary: Denetim sonucu
      description: |
        Bir denetimin bulgularını, görünürlük skorunu ve (üretildiyse) PDF yolunu ile
        erişim mesajı taslağını döndürür (SPEC §7).
      operationId: getAudit
      parameters:
        - name: id
          in: path
          required: true
          description: Denetim kimliği.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Denetim bulguları ve skoru
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audit'
        '404':
          description: Böyle bir denetim yok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

components:
  schemas:

    Health:
      type: object
      title: Health
      description: Servis ve bağımlılık durumu.
      additionalProperties: false
      required: [status, db, redis]
      properties:
        status:
          $ref: '#/components/schemas/ComponentStatus'
        db:
          $ref: '#/components/schemas/ComponentStatus'
        redis:
          $ref: '#/components/schemas/ComponentStatus'

    ComponentStatus:
      type: string
      title: ComponentStatus
      description: Tek bir bileşenin sağlık durumu.
      enum: [ok, error]

    Stats:
      type: object
      title: Stats
      description: Panel üst şeridindeki toplam sayaçlar.
      additionalProperties: false
      required: [scanned, qualified, reports, monthly_cost_usd]
      properties:
        scanned:
          type: integer
          minimum: 0
          description: Triyajı yapılmış işletme sayısı.
        qualified:
          type: integer
          minimum: 0
          description: Triyaj durumu `qualified` olan işletme sayısı.
        reports:
          type: integer
          minimum: 0
          description: Üretilmiş denetim raporu sayısı.
        monthly_cost_usd:
          type: number
          format: double
          minimum: 0
          description: |
            İçinde bulunulan takvim ayındaki gerçekleşen LLM maliyeti (USD).
            `audits.llm_cost_usd` alanlarının toplamıdır.

    TriageStatus:
      type: string
      title: TriageStatus
      description: Triyaj sonucu (SPEC §3).
      enum: [qualified, watch, rejected]

    Business:
      type: object
      title: Business
      description: |
        `businesses` tablosundan türer (SPEC §3); üzerine en son triyaj skorunu taşıyan
        `score` ve `status` alanları eklenir.
      additionalProperties: false
      required:
        - id
        - place_id
        - name
        - category
        - address
        - phone
        - website
        - ig_handle
        - rating_count
        - discovered_at
        - score
        - status
      properties:
        id:
          type: integer
          format: int64
          description: Birincil anahtar.
        place_id:
          type: string
          description: Google Places yer kimliği.
        name:
          type: string
          description: İşletme adı.
        category:
          type: [string, 'null']
          description: Places kategorisi. Eşlenemediyse null.
        address:
          type: [string, 'null']
          description: Açık adres. Places döndürmediyse null.
        phone:
          type: [string, 'null']
          description: Telefon numarası. Bilinmiyorsa null.
        website:
          type: [string, 'null']
          format: uri
          description: Web sitesi. Yoksa null.
        ig_handle:
          type: [string, 'null']
          description: Instagram kullanıcı adı, `@` işareti olmadan. Henüz eşlenmediyse null.
        rating_count:
          type: [integer, 'null']
          minimum: 0
          description: Places değerlendirme sayısı. Bilinmiyorsa null.
        discovered_at:
          type: string
          format: date-time
          description: Kaydın keşfedildiği an (UTC).
        score:
          type: [number, 'null']
          format: double
          minimum: 0
          maximum: 100
          description: En son birleşik triyaj skoru (SPEC §4). Henüz taranmadıysa null.
        status:
          oneOf:
            - $ref: '#/components/schemas/TriageStatus'
            - type: 'null'
          description: En son triyaj durumu. Henüz taranmadıysa null.

    BusinessList:
      type: object
      title: BusinessList
      description: Sayfalanmış işletme listesi.
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          description: Bu sayfadaki kayıtlar.
          items:
            $ref: '#/components/schemas/Business'
        total:
          type: integer
          minimum: 0
          description: Sayfalama uygulanmadan önce filtreye uyan toplam kayıt sayısı.

    DiscoveryRequest:
      type: object
      title: DiscoveryRequest
      description: Keşif taramasının parametreleri.
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          description: Places arama sorgusu, ör. "kuyumcu" veya "diş kliniği".
        region:
          type: string
          minLength: 1
          default: Samsun
          description: Aramanın yapılacağı bölge. Varsayılan Samsun (SPEC §1).
        limit:
          type: [integer, 'null']
          minimum: 1
          maximum: 200
          description: En fazla kaç işletme keşfedilsin. Verilmezse adaptör varsayılanı.

    JobAccepted:
      type: object
      title: JobAccepted
      description: Kuyruğa alınan işin kimliği. Uç bunu anında döner (senkron iş yok).
      additionalProperties: false
      required: [job_id]
      properties:
        job_id:
          type: string
          minLength: 1
          description: İşi `GET /jobs/{id}` ile yoklamak için kimlik.

    JobState:
      type: string
      title: JobState
      description: Bir kuyruk işinin yaşam döngüsü durumu.
      enum: [queued, running, done, error]

    JobProgress:
      type: object
      title: JobProgress
      description: İşin ilerleme sayaçları.
      additionalProperties: false
      required: [processed, total]
      properties:
        processed:
          type: integer
          minimum: 0
          description: Şimdiye kadar işlenen öğe sayısı.
        total:
          type: [integer, 'null']
          minimum: 0
          description: Beklenen toplam öğe sayısı. Henüz bilinmiyorsa null.

    JobResult:
      type: object
      title: JobResult
      description: |
        İş tamamlandığında yazılanların özeti. Keşif işi `businesses`/`snapshots`
        doldurur; denetim işi `audit_id` doldurur (diğerleri 0). Arayüz denetim işi
        `done` olunca `audit_id` ile `GET /audits/{id}`'ye gider.
      additionalProperties: false
      required: [businesses, snapshots, audit_id]
      properties:
        businesses:
          type: integer
          minimum: 0
          description: Yazılan/güncellenen işletme kaydı sayısı (keşif işi).
        snapshots:
          type: integer
          minimum: 0
          description: Alınan snapshot sayısı (keşif işi).
        audit_id:
          type: [integer, 'null']
          format: int64
          description: Üretilen denetimin kimliği (denetim işi). Keşif işinde null.

    JobStatus:
      type: object
      title: JobStatus
      description: Kuyruk işinin güncel durumu.
      additionalProperties: false
      required: [job_id, status, progress, result, error]
      properties:
        job_id:
          type: string
          minLength: 1
          description: İş kimliği.
        status:
          $ref: '#/components/schemas/JobState'
        progress:
          oneOf:
            - $ref: '#/components/schemas/JobProgress'
            - type: 'null'
          description: İlerleme sayaçları. İş henüz başlamadıysa null.
        result:
          oneOf:
            - $ref: '#/components/schemas/JobResult'
            - type: 'null'
          description: Sonuç özeti. Yalnızca `status` `done` olduğunda dolar, aksi halde null.
        error:
          type: [string, 'null']
          description: Hata mesajı. Yalnızca `status` `error` olduğunda dolar, aksi halde null.

    Severity:
      type: string
      title: Severity
      description: |
        Bulgu önemi = ceza ağırlığı (SPEC §5). Görünürlük skoru bu bulguların ağırlıklı
        cezasının 100'den düşülmesiyle bulunur. Değerler SPEC §5 ile birebir.
      enum: [kritik, yüksek, orta, düşük]

    Finding:
      type: object
      title: Finding
      description: |
        Deterministik bir kuraldan doğan tek denetim bulgusu (SPEC §5). LLM bulgu
        **icat etmez**: `detail` deterministik tetikten gelir (kural + eşik), `message`
        ise LLM'in bu bulguyu ajans diline çevirdiği metindir. İki alan ayrı tutulur ki
        neyin ölçülüp neyin yazıya döküldüğü karışmasın.
      additionalProperties: false
      required: [rule, title, severity, detail, message]
      properties:
        rule:
          type: string
          description: Kural makine kimliği, ör. `reels_yok`, `bio_donusum_yok`.
        title:
          type: string
          description: Kuralın insan okunur adı, ör. "Reels yok".
        severity:
          $ref: '#/components/schemas/Severity'
        detail:
          type: string
          description: Deterministik tetik açıklaması (ölçülen değer + eşik). LLM'siz üretilir.
        message:
          type: [string, 'null']
          description: |
            LLM'in (Sonnet) ürettiği ajans-dili metni. Sentez öncesi veya atlandıysa null;
            deterministik `detail` daima doludur.

    OutreachStatus:
      type: string
      title: OutreachStatus
      description: |
        Erişim kaydının durumu (SPEC §3). Kayıt daima `draft` doğar; sistem hiçbir
        koşulda otomatik mesaj göndermez, ileri durumlara yalnız insan kararıyla geçilir.
      enum: [draft, sent, opened, replied, meeting, won, lost]

    OutreachDraft:
      type: object
      title: OutreachDraft
      description: |
        Denetime bağlı erişim mesajı taslağının özeti (SPEC §3 `outreach`). Denetim
        yanıtında taşınır ki panel taslağı gösterip kopyalayabilsin; durum güncelleme
        ayrı `PATCH /outreach/{id}` ucundadır (sonraki faz).
      additionalProperties: false
      required: [id, channel, draft, status]
      properties:
        id:
          type: integer
          format: int64
        channel:
          type: string
          description: İletişim kanalı, ör. `instagram_dm`, `email`.
        draft:
          type: string
          description: Üretilen mesaj taslağının metni.
        status:
          $ref: '#/components/schemas/OutreachStatus'

    Audit:
      type: object
      title: Audit
      description: |
        Bir derin denetimin sonucu (SPEC §3 `audits` + §7). `findings` deterministik
        kurallardan doğar; `report_text` LLM sentezidir; `pdf_path` PDF üretildiğinde
        (Faz 5) dolar.
      additionalProperties: false
      required:
        - id
        - business_id
        - visibility_score
        - findings
        - report_text
        - pdf_path
        - llm_cost_usd
        - generated_at
        - outreach
      properties:
        id:
          type: integer
          format: int64
        business_id:
          type: integer
          format: int64
          description: Denetlenen işletme.
        visibility_score:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Bulguların ağırlıklı cezasının 100'den düşülmesiyle bulunan skor (SPEC §5).
        findings:
          type: array
          description: Deterministik bulgular (SPEC §5). Boş olabilir (hiç kural tetiklenmediyse).
          items:
            $ref: '#/components/schemas/Finding'
        report_text:
          type: [string, 'null']
          description: LLM'in (Sonnet) ürettiği rapor metni. Sentez tamamlanana kadar null.
        pdf_path:
          type: [string, 'null']
          description: Üretilen PDF raporunun yolu/bağlantısı. PDF Faz 5 — o zamana kadar null.
        llm_cost_usd:
          type: number
          format: double
          minimum: 0
          description: Bu denetimin gerçek LLM maliyeti (USD). Maliyet disiplini gereği boş kalamaz.
        generated_at:
          type: string
          format: date-time
          description: Denetimin üretildiği an (UTC).
        outreach:
          oneOf:
            - $ref: '#/components/schemas/OutreachDraft'
            - type: 'null'
          description: Erişim mesajı taslağı. Sentez öncesi veya henüz üretilmediyse null.

    ErrorMessage:
      type: object
      title: ErrorMessage
      description: Basit hata gövdesi (ör. 404).
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: string
          description: İnsan okunur hata açıklaması.

    ValidationError:
      type: object
      title: ValidationError
      description: FastAPI sorgu/gövde doğrulama hatası.
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'

    ValidationErrorItem:
      type: object
      title: ValidationErrorItem
      additionalProperties: false
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          description: Hatalı alanın konumu, ör. `["query", "min_score"]`.
          items:
            type: [string, integer]
        msg:
          type: string
          description: İnsan okunur hata mesajı.
        type:
          type: string
          description: Pydantic hata tipi.
