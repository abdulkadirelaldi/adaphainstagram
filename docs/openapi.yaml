openapi: 3.1.0

info:
  title: Radar API
  version: 0.1.0
  description: |
    Kıyı Medya aday tarama ve denetim sistemi.

    Faz 1 (iskelet) kapsamı: `/health`, `/stats`, `/businesses`. Kalan uçlar
    (`/discovery/run`, `/businesses/{id}/audit`, `/audits/{id}`, `/outreach/{id}`,
    `/jobs/{id}`) sonraki fazlarda bu dosyaya eklenir — SPEC §7 ve §8.

    Bu API yalnızca oturum açmadan erişilebilen halka açık veriyi döndürür. Erişim,
    gösterim, kaydetme, profil ziyareti ve demografi verisi sistemde **yoktur** ve
    hiçbir şemada yer almaz (CLAUDE.md kural 7).

servers:
  - url: http://localhost:8000
    description: Yerel geliştirme

# Faz 1'de kimlik doğrulama yoktur: servis yalnızca yerel ağda çalışır ve SPEC §8
# Faz 1 kapsamı auth içermez. Boş dizi bunu "tanımlanmamış" değil "bilinçli olarak
# yok" diye beyan eder. Kimlik doğrulama Faz 6 (sertleştirme) konusudur.
security: []

tags:
  - name: system
    description: Servis sağlığı
  - name: dashboard
    description: Panel verileri
  - name: discovery
    description: Keşif taraması
  - name: jobs
    description: Kuyruk işleri

paths:
  /health:
    get:
      tags: [system]
      summary: Servis sağlığı
      description: |
        Postgres ve Redis bağlantılarını gerçekten yoklar. Bağımlılıklardan biri
        erişilemezse 503 döner ve ilgili alan `ok` olmaz.
      operationId: getHealth
      responses:
        '200':
          description: Tüm bağımlılıklar sağlıklı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: En az bir bağımlılık erişilemez durumda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /stats:
    get:
      tags: [dashboard]
      summary: Panel üst şeridi
      operationId: getStats
      responses:
        '200':
          description: Toplam sayaçlar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'

  /businesses:
    get:
      tags: [dashboard]
      summary: Aday listesi
      description: |
        Sayfalanmış işletme listesi. Her kayıt en son triyaj skorunu ve durumunu taşır;
        henüz taranmamış işletmelerde `score` ve `status` `null` olur.
      operationId: listBusinesses
      parameters:
        - name: status
          in: query
          required: false
          description: Triyaj durumuna göre filtre. Verilmezse tüm durumlar döner.
          schema:
            $ref: '#/components/schemas/TriageStatus'
        - name: category
          in: query
          required: false
          description: İşletme kategorisine göre birebir filtre.
          schema:
            type: string
            minLength: 1
        - name: min_score
          in: query
          required: false
          description: Bu değerin altındaki triyaj skoruna sahip kayıtlar elenir. Skoru olmayan kayıtlar da elenir.
          schema:
            type: number
            format: double
            minimum: 0
            maximum: 100
        - name: limit
          in: query
          required: false
          description: Sayfa başına kayıt sayısı.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Atlanacak kayıt sayısı.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Filtreye uyan işletmeler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessList'
        '422':
          description: Geçersiz sorgu parametresi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /discovery/run:
    post:
      tags: [discovery]
      summary: Keşif taraması başlat
      description: |
        Bir bölge ve sorgu için Google Places keşfini kuyruğa alır. Senkron scraping
        yoktur (SPEC §7): uç anında bir `job_id` döner, ilerleme `GET /jobs/{id}` ile
        yoklanır. Yalnızca oturum açmadan erişilebilen halka açık veri toplanır.
      operationId: runDiscovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryRequest'
      responses:
        '202':
          description: İş kuyruğa alındı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '422':
          description: Geçersiz istek gövdesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /jobs/{id}:
    get:
      tags: [jobs]
      summary: Kuyruk işinin durumu
      description: |
        Kuyruğa alınmış bir işin durumunu döndürür. Arayüz bu ucu yoklayarak keşif/
        scraping ilerlemesini izler (FE-4).
      operationId: getJob
      parameters:
        - name: id
          in: path
          required: true
          description: "`POST /discovery/run` ucunun döndürdüğü iş kimliği."
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: İşin güncel durumu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404':
          description: Böyle bir iş yok (bilinmeyen veya süresi dolmuş `job_id`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

components:
  schemas:

    Health:
      type: object
      title: Health
      description: Servis ve bağımlılık durumu.
      additionalProperties: false
      required: [status, db, redis]
      properties:
        status:
          $ref: '#/components/schemas/ComponentStatus'
        db:
          $ref: '#/components/schemas/ComponentStatus'
        redis:
          $ref: '#/components/schemas/ComponentStatus'

    ComponentStatus:
      type: string
      title: ComponentStatus
      description: Tek bir bileşenin sağlık durumu.
      enum: [ok, error]

    Stats:
      type: object
      title: Stats
      description: Panel üst şeridindeki toplam sayaçlar.
      additionalProperties: false
      required: [scanned, qualified, reports, monthly_cost_usd]
      properties:
        scanned:
          type: integer
          minimum: 0
          description: Triyajı yapılmış işletme sayısı.
        qualified:
          type: integer
          minimum: 0
          description: Triyaj durumu `qualified` olan işletme sayısı.
        reports:
          type: integer
          minimum: 0
          description: Üretilmiş denetim raporu sayısı.
        monthly_cost_usd:
          type: number
          format: double
          minimum: 0
          description: |
            İçinde bulunulan takvim ayındaki gerçekleşen LLM maliyeti (USD).
            `audits.llm_cost_usd` alanlarının toplamıdır.

    TriageStatus:
      type: string
      title: TriageStatus
      description: Triyaj sonucu (SPEC §3).
      enum: [qualified, watch, rejected]

    Business:
      type: object
      title: Business
      description: |
        `businesses` tablosundan türer (SPEC §3); üzerine en son triyaj skorunu taşıyan
        `score` ve `status` alanları eklenir.
      additionalProperties: false
      required:
        - id
        - place_id
        - name
        - category
        - address
        - phone
        - website
        - ig_handle
        - rating_count
        - discovered_at
        - score
        - status
      properties:
        id:
          type: integer
          format: int64
          description: Birincil anahtar.
        place_id:
          type: string
          description: Google Places yer kimliği.
        name:
          type: string
          description: İşletme adı.
        category:
          type: [string, 'null']
          description: Places kategorisi. Eşlenemediyse null.
        address:
          type: [string, 'null']
          description: Açık adres. Places döndürmediyse null.
        phone:
          type: [string, 'null']
          description: Telefon numarası. Bilinmiyorsa null.
        website:
          type: [string, 'null']
          format: uri
          description: Web sitesi. Yoksa null.
        ig_handle:
          type: [string, 'null']
          description: Instagram kullanıcı adı, `@` işareti olmadan. Henüz eşlenmediyse null.
        rating_count:
          type: [integer, 'null']
          minimum: 0
          description: Places değerlendirme sayısı. Bilinmiyorsa null.
        discovered_at:
          type: string
          format: date-time
          description: Kaydın keşfedildiği an (UTC).
        score:
          type: [number, 'null']
          format: double
          minimum: 0
          maximum: 100
          description: En son birleşik triyaj skoru (SPEC §4). Henüz taranmadıysa null.
        status:
          oneOf:
            - $ref: '#/components/schemas/TriageStatus'
            - type: 'null'
          description: En son triyaj durumu. Henüz taranmadıysa null.

    BusinessList:
      type: object
      title: BusinessList
      description: Sayfalanmış işletme listesi.
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          description: Bu sayfadaki kayıtlar.
          items:
            $ref: '#/components/schemas/Business'
        total:
          type: integer
          minimum: 0
          description: Sayfalama uygulanmadan önce filtreye uyan toplam kayıt sayısı.

    DiscoveryRequest:
      type: object
      title: DiscoveryRequest
      description: Keşif taramasının parametreleri.
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          description: Places arama sorgusu, ör. "kuyumcu" veya "diş kliniği".
        region:
          type: string
          minLength: 1
          default: Samsun
          description: Aramanın yapılacağı bölge. Varsayılan Samsun (SPEC §1).
        limit:
          type: [integer, 'null']
          minimum: 1
          maximum: 200
          description: En fazla kaç işletme keşfedilsin. Verilmezse adaptör varsayılanı.

    JobAccepted:
      type: object
      title: JobAccepted
      description: Kuyruğa alınan işin kimliği. Uç bunu anında döner (senkron iş yok).
      additionalProperties: false
      required: [job_id]
      properties:
        job_id:
          type: string
          minLength: 1
          description: İşi `GET /jobs/{id}` ile yoklamak için kimlik.

    JobState:
      type: string
      title: JobState
      description: Bir kuyruk işinin yaşam döngüsü durumu.
      enum: [queued, running, done, error]

    JobProgress:
      type: object
      title: JobProgress
      description: İşin ilerleme sayaçları.
      additionalProperties: false
      required: [processed, total]
      properties:
        processed:
          type: integer
          minimum: 0
          description: Şimdiye kadar işlenen öğe sayısı.
        total:
          type: [integer, 'null']
          minimum: 0
          description: Beklenen toplam öğe sayısı. Henüz bilinmiyorsa null.

    JobResult:
      type: object
      title: JobResult
      description: İş tamamlandığında yazılanların özeti.
      additionalProperties: false
      required: [businesses, snapshots]
      properties:
        businesses:
          type: integer
          minimum: 0
          description: Yazılan/güncellenen işletme kaydı sayısı.
        snapshots:
          type: integer
          minimum: 0
          description: Alınan snapshot sayısı.

    JobStatus:
      type: object
      title: JobStatus
      description: Kuyruk işinin güncel durumu.
      additionalProperties: false
      required: [job_id, status, progress, result, error]
      properties:
        job_id:
          type: string
          minLength: 1
          description: İş kimliği.
        status:
          $ref: '#/components/schemas/JobState'
        progress:
          oneOf:
            - $ref: '#/components/schemas/JobProgress'
            - type: 'null'
          description: İlerleme sayaçları. İş henüz başlamadıysa null.
        result:
          oneOf:
            - $ref: '#/components/schemas/JobResult'
            - type: 'null'
          description: Sonuç özeti. Yalnızca `status` `done` olduğunda dolar, aksi halde null.
        error:
          type: [string, 'null']
          description: Hata mesajı. Yalnızca `status` `error` olduğunda dolar, aksi halde null.

    ErrorMessage:
      type: object
      title: ErrorMessage
      description: Basit hata gövdesi (ör. 404).
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: string
          description: İnsan okunur hata açıklaması.

    ValidationError:
      type: object
      title: ValidationError
      description: FastAPI sorgu/gövde doğrulama hatası.
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'

    ValidationErrorItem:
      type: object
      title: ValidationErrorItem
      additionalProperties: false
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          description: Hatalı alanın konumu, ör. `["query", "min_score"]`.
          items:
            type: [string, integer]
        msg:
          type: string
          description: İnsan okunur hata mesajı.
        type:
          type: string
          description: Pydantic hata tipi.
