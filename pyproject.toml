[project]
name = "radar-api"
version = "0.1.0"
description = "Radar — Kıyı Medya aday tarama ve denetim sistemi, backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
]

# Lint, tip ve test ayarları bilinçli olarak burada DEĞİL. Bunlar güvenlik & test
# ajanının sahibi olduğu ruff.toml / mypy.ini / pytest.ini dosyalarında durur.
# Dört ajan aynı repoda çalıştığı için bu ayrım çakışmayı önler.
# Detay: docs/TASKS.md — "Araç konfigürasyonu sahipliği".

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
