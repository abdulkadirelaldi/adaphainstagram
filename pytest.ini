# Radar — test konfigürasyonu
# Sahip: güvenlik & test ajanı (docs/TASKS.md "Araç konfigürasyonu sahipliği")
# pyproject.toml backend'indir ve [tool.pytest.ini_options] bölümü İÇERMEZ.

[pytest]
testpaths = tests
pythonpath = .

# pytest-asyncio: her async test'e ayrı ayrı @pytest.mark.asyncio koymaya gerek yok.
asyncio_mode = auto

addopts =
    --strict-markers
    --strict-config
    -ra
    --showlocals

markers =
    e2e: Playwright uçtan uca testi (CI'da ayrı job, varsayılan koşuda dışlanır)

# Uyarıları hata say — kullanımdan kalkmış API sessizce birikmesin.
filterwarnings =
    error
    ignore::DeprecationWarning:passlib.*
