# Radar — lint + format konfigürasyonu
# Sahip: güvenlik & test ajanı (docs/TASKS.md "Araç konfigürasyonu sahipliği")
# pyproject.toml backend'indir ve [tool.ruff] bölümü İÇERMEZ. Ayarlar burada durur.

target-version = "py312"
line-length = 100
indent-width = 4

# `ruff check .` kökten çalışır; üretim kodu api/ altında.
src = ["api", "tests"]

extend-exclude = [
    ".venv",
    # Yalnızca Alembic'in autogenerate ettiği revizyon dosyaları dışlanır. Gerçek
    # yol api/migrations/versions — önceki "migrations/versions" hiçbir şeye uymuyordu,
    # dolayısıyla her yeni migration lint gürültüsü yapardı (BE-2-B1). env.py ve
    # script.py.mako gibi elle yazılan altyapı BİLİNÇLİ olarak kapsamda kalır.
    "api/migrations/versions",
    "web",                  # frontend ajanının alanı, JS/TS tarafı ayrı lint'lenir
]

[lint]
select = [
    "E",    # pycodestyle hataları
    "W",    # pycodestyle uyarıları
    "F",    # pyflakes
    "I",    # isort — import sırası
    "N",    # pep8-naming
    "UP",   # pyupgrade — py312 deyimleri
    "B",    # flake8-bugbear
    "A",    # builtin gölgeleme
    "C4",   # comprehension'lar
    "DTZ",  # naive datetime yasak — snapshot/audit zaman damgaları tz-aware olmalı
    "T20",  # print() yasak, logging kullan
    "SIM",  # sadeleştirme
    "PTH",  # pathlib
    "RUF",  # ruff'a özel
    "ASYNC",# async tuzakları — async yolda bloklayan çağrı
    "S",    # bandit — güvenlik
]

ignore = [
    "E501",    # satır uzunluğu formatter'ın işi
    "B008",    # FastAPI Depends() varsayılan argümanda meşrudur
    # Projenin dili Türkçe: yorum, docstring ve string'lerde ı/ş/ğ/İ ve — karakterleri
    # normaldir. Bu üç kural "belirsiz Unicode" diye onları işaretler ve tümü yanlış
    # pozitiftir (açıldığında 180 hata, hepsi Türkçe metin). Kapalı kalır.
    "RUF001",  # string'de belirsiz karakter
    "RUF002",  # docstring'de belirsiz karakter
    "RUF003",  # yorumda belirsiz karakter
]

[lint.per-file-ignores]
# Testlerde assert (S101) ve sabit "sır" görünümlü fixture değerleri normaldir.
"tests/**" = ["S101", "S105", "S106"]

[lint.isort]
known-first-party = ["api", "tests"]

[lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
