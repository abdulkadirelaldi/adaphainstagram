# Radar — tip kontrolü konfigürasyonu
# Sahip: güvenlik & test ajanı (docs/TASKS.md "Araç konfigürasyonu sahipliği")
# pyproject.toml backend'indir ve [tool.mypy] bölümü İÇERMEZ.

[mypy]
python_version = 3.12
files = api, tests

# strict mod — aşağıdaki blok `--strict` bayrağının açtığı kontrollerin tamamıdır,
# açıkça yazıldı ki hangi kontrolün kapatıldığı gözden kaçmasın.
warn_unused_configs = True
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
strict_equality = True
extra_checks = True

# strict'in ötesinde
warn_unreachable = True
show_error_codes = True
pretty = True

# Pydantic v2 mypy eklentisi. SQLAlchemy 2.0 için eklenti YOKTUR ve olmamalıdır:
# sqlalchemy.ext.mypy.plugin 2.0'da kullanımdan kaldırıldı; 2.0 Mapped[] ile
# PEP 484 yerel tiplemesi kullanır ve eklenti açılırsa yanlış pozitif üretir.
# Bkz. docs/REVIEW.md — SEC-1 sapma notu.
plugins = pydantic.mypy

[pydantic-mypy]
init_typed = True
init_forbid_extra = True
warn_required_dynamic_aliases = True

# NOT: `[mypy-migrations.*]`, `[mypy-apify_client.*]`, `[mypy-arq.*]` bölümleri
# bilinçli olarak burada değil. İlgili paketler repoya girmeden bölüm eklemek
# `warn_unused_configs` altında "unused section" uyarısı üretiyor. Alembic (Faz 1
# sonu), apify-client ve arq (Faz 2) geldiğinde bu bölümler eklenecek.
