# Radar — Alembic konfigürasyonu.
#
# Migration dizini backend'in sahipliğindeki `api/` altında durur (docs/TASKS.md
# "Dokunabileceğin dosyalar: api/**"). Repo kökünden çalıştır:
#     alembic -c api/alembic.ini upgrade head
#
# Veritabanı adresi burada DEĞİL: env.py onu api.config.Settings üzerinden .env'den
# okur. Böylece tek bir sır kaynağı olur ve alembic.ini'ye adres gömülmez (CLAUDE.md
# kural 4).

[alembic]
# %(here)s = bu dosyanın dizini (api/). Böylece nereden çalıştırılırsa çalıştırılsın
# migration dizini doğru çözülür.
script_location = %(here)s/migrations

# `import api` çalışsın diye repo kökü sys.path'e eklenir.
prepend_sys_path = .

# UTC zaman damgalı revizyon dosya adları.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
