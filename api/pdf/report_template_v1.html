<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1a1a1a; margin: 0; padding: 40px 48px; font-size: 13px; line-height: 1.5;
  }
  header { border-bottom: 2px solid #1a1a1a; padding-bottom: 16px; margin-bottom: 24px; }
  .brand { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #666; }
  h1 { font-size: 24px; margin: 4px 0 0; }
  .score-box { display: flex; align-items: baseline; gap: 12px; margin: 20px 0 28px; }
  .score { font-size: 44px; font-weight: 700; }
  .score-label { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
  h2 { font-size: 15px; margin: 28px 0 12px; border-bottom: 1px solid #ddd; padding-bottom: 6px; }
  .report-text { white-space: pre-wrap; }
  .finding { margin: 0 0 16px; padding-left: 14px; border-left: 3px solid #ccc; }
  .finding.kritik { border-left-color: #b00020; }
  .finding.yuksek { border-left-color: #d97706; }
  .finding.orta   { border-left-color: #ca8a04; }
  .finding.dusuk  { border-left-color: #6b7280; }
  .finding-title { font-weight: 700; }
  .severity { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #fff;
              padding: 1px 7px; border-radius: 3px; margin-left: 8px; vertical-align: middle; }
  .severity.kritik { background: #b00020; }
  .severity.yuksek { background: #d97706; }
  .severity.orta   { background: #ca8a04; }
  .severity.dusuk  { background: #6b7280; }
  .detail { color: #555; font-size: 12px; margin-top: 2px; }
  .message { margin-top: 4px; }
  footer { margin-top: 36px; padding-top: 12px; border-top: 1px solid #ddd;
           font-size: 11px; color: #888; }
</style>
</head>
<body>
  <header>
    <div class="brand">Kıyı Medya · Radar Denetim Raporu</div>
    <h1>{{business_name}}</h1>
  </header>

  <div class="score-box">
    <div class="score">{{visibility_score}}</div>
    <div class="score-label">Görünürlük skoru<br>(100 üzerinden)</div>
  </div>

  <h2>Özet</h2>
  <div class="report-text">{{report_text}}</div>

  <h2>Bulgular</h2>
  {{findings_html}}

  <footer>Bu rapor otomatik üretilmiştir. Yalnız halka açık veriye dayanır.</footer>
</body>
</html>
